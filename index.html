<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORacle — Anesthesia Bench</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b2737">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#23201d; --ink-faint:#6b645c; --bg:#f6f4ef; --paper:#fffdf9; --line:#e2dcd2;
    --oxblood:#6b2737; --teal:#2f6f6a; --gold:#9a7b29; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header.shell{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 16px;
    background:var(--paper);border-bottom:1px solid var(--line);z-index:10;min-height:54px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:9px;margin-right:6px}
  .brand .logo{width:30px;height:30px;flex:0 0 auto}
  .brand .txt{display:flex;flex-direction:column;line-height:1.0}
  .brand .nm{font-family:"Newsreader",serif;font-size:21px;font-weight:600;letter-spacing:.01em}
  .brand .nm b{color:var(--oxblood);font-weight:600}
  .brand .sub{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
  .seg button{appearance:none;border:0;background:transparent;cursor:pointer;font-family:"IBM Plex Sans";
    font-size:13.5px;font-weight:600;color:var(--ink-faint);padding:8px 16px;display:flex;align-items:center;gap:7px}
  .seg button .dot{width:7px;height:7px;border-radius:50%;opacity:.5}
  .seg button[data-app="preop"] .dot{background:var(--teal)}
  .seg button[data-app="proc"] .dot{background:var(--oxblood)}
  .seg button[data-app="peds"] .dot{background:var(--gold)}
  .seg button.active{background:var(--paper);color:var(--ink);box-shadow:inset 0 -2px 0 currentColor}
  .seg button.active .dot{opacity:1}
  .seg button[data-app="preop"].active{color:var(--teal)}
  .seg button[data-app="proc"].active{color:var(--oxblood)}
  .seg button[data-app="peds"].active{color:var(--gold)}
  #back{margin-left:auto;display:none;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);
    cursor:pointer;border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--ink)}
  #back:hover{border-color:var(--oxblood);color:var(--oxblood)}
  .hint{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  .wrap{flex:1 1 auto;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
  iframe.hidden{display:none}
</style>
</head>
<body>
  <header class="shell">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#6b2737" stroke-width="2.4"/>
        <polyline points="7,22 13,22 16,12 20,28 23,19 27,19 29,22 33,22" fill="none"
          stroke="#2f6f6a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="txt"><span class="nm">OR<b>acle</b></span><span class="sub">Anesthesia · Perioperative</span></div>
    </div>
    <div class="seg" id="seg">
      <button data-app="preop"><span class="dot"></span>Pre-op</button>
      <button data-app="proc" class="active"><span class="dot"></span>Procedures</button>
      <button data-app="peds"><span class="dot"></span>Peds dosing</button>
    </div>
    <button id="back" title="Return to where you jumped from">← Back</button>
    <span class="hint" id="hint">one bench · three references</span>
  </header>
  <div class="wrap">
    <iframe id="if-preop" class="hidden" src="preop/index.html"></iframe>
    <iframe id="if-proc"  src="procedures/index.html"></iframe>
    <iframe id="if-peds"  class="hidden" src="peds/index.html"></iframe>
  </div>
<script>
  const APPS={preop:"if-preop",proc:"if-proc",peds:"if-peds"};
  const seg=[...document.querySelectorAll('#seg button')];
  const back=document.getElementById('back'), hint=document.getElementById('hint');
  let cur='proc';
  function show(app){
    cur=app;
    for(const k in APPS) document.getElementById(APPS[k]).classList.toggle('hidden',k!==app);
    seg.forEach(b=>b.classList.toggle('active', b.dataset.app===app));
  }
  seg.forEach(b=>b.onclick=()=>show(b.dataset.app));
  // --- global cross-app Back stack (used by xref.js once links are wired) ---
  window.ORACLE={
    show,
    jumpStack:[],
    // navigate to {app, hash}; remember origin for Back
    jump(target, originLabel){
      this.jumpStack.push({app:cur, label:originLabel||cur});
      const id=APPS[target.app];
      const fr=document.getElementById(id);
      fr.src = target.app==='proc'
        ? 'procedures/index.html?j='+Date.now()+(target.hash?('#'+target.hash):'')
        : (target.app+'/index.html?j='+Date.now()+(target.hash?('#'+target.hash):''));
      show(target.app);
      back.style.display='inline-flex'; hint.style.display='none';
      back.textContent='← Back to '+(this.jumpStack[this.jumpStack.length-1].label);
    }
  };
  back.onclick=()=>{
    const o=window.ORACLE.jumpStack.pop();
    if(o){ show(o.app); }
    if(!window.ORACLE.jumpStack.length){ back.style.display='none'; hint.style.display='inline'; }
    else back.textContent='← Back to '+window.ORACLE.jumpStack[window.ORACLE.jumpStack.length-1].label;
  };
</script>
</body>
</html>
